<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matriz de Prioridades</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f4f3ef;
      --surface:  #ffffff;
      --border:   #e2dfd6;
      --text:     #1a1a18;
      --muted:    #7a7870;
      --radius:   10px;
      --shadow:   0 1px 3px rgba(0,0,0,.07), 0 2px 8px rgba(0,0,0,.04);

      --q1-accent: #d94f43;
      --q1-bg:     #fff8f7;
      --q2-accent: #3478d4;
      --q2-bg:     #f4f8ff;
      --q3-accent: #c97b1a;
      --q3-bg:     #fffbf2;
      --q4-accent: #9ca3af;
      --q4-bg:     #f9f9f8;

      --tag-pessoal: #3478d4;
      --tag-minha:   #16a34a;
      --tag-time:    #c97b1a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────── */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 4px rgba(0,0,0,.05);
    }
    .header-title {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -.02em;
      white-space: nowrap;
    }
    .header-title em { color: var(--q1-accent); font-style: normal; }

    .stats-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; flex: 1; }
    .stat-chip {
      font-size: .7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
      border: 1.5px solid currentColor;
    }

    .filter-bar { display: flex; gap: 5px; align-items: center; }
    .filter-label { font-size: .72rem; color: var(--muted); white-space: nowrap; }
    .filter-btn {
      font-size: .7rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 99px;
      border: 1.5px solid var(--border);
      background: transparent;
      cursor: pointer;
      color: var(--muted);
      transition: all .14s;
      white-space: nowrap;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--text); }
    .filter-btn.active-all    { background: var(--text);        border-color: var(--text);        color: #fff; }
    .filter-btn.active-pessoal{ background: var(--tag-pessoal); border-color: var(--tag-pessoal); color: #fff; }
    .filter-btn.active-minha  { background: var(--tag-minha);   border-color: var(--tag-minha);   color: #fff; }
    .filter-btn.active-time   { background: var(--tag-time);    border-color: var(--tag-time);    color: #fff; }

    .archive-btn {
      font-size: .72rem;
      padding: 5px 11px;
      border-radius: 7px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      cursor: pointer;
      color: var(--muted);
      transition: all .14s;
      white-space: nowrap;
    }
    .archive-btn:hover { border-color: var(--muted); color: var(--text); }

    /* ── Matrix grid ─────────────────────────────────── */
    .matrix {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 14px;
      max-width: 1300px;
      margin: 0 auto;
    }
    @media (max-width: 680px) {
      .matrix { grid-template-columns: 1fr; }
    }

    /* ── Quadrant ────────────────────────────────────── */
    .quadrant {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 300px;
      max-height: calc(50vh - 48px);
      overflow: hidden;
      transition: border-color .18s, box-shadow .18s;
    }
    @media (max-width: 680px) {
      .quadrant { max-height: none; min-height: 220px; }
    }
    .quadrant[data-q="1"] { border-top: 3px solid var(--q1-accent); background: var(--q1-bg); }
    .quadrant[data-q="2"] { border-top: 3px solid var(--q2-accent); background: var(--q2-bg); }
    .quadrant[data-q="3"] { border-top: 3px solid var(--q3-accent); background: var(--q3-bg); }
    .quadrant[data-q="4"] { border-top: 3px solid var(--q4-accent); background: var(--q4-bg); }
    .quadrant.drag-over {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,.14);
    }

    .q-header {
      padding: 11px 12px 8px;
      display: flex;
      align-items: center;
      gap: 7px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .q-icon { font-size: 1.05rem; line-height: 1; }
    .q-info { flex: 1; min-width: 0; }
    .q-title { font-size: .82rem; font-weight: 700; }
    .q-sub   { font-size: .62rem; color: var(--muted); margin-top: 1px; }
    .q-count {
      font-size: .68rem; font-weight: 700;
      padding: 2px 6px; border-radius: 99px;
      background: rgba(0,0,0,.06); color: var(--muted);
    }
    .q-add {
      width: 24px; height: 24px;
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-size: 1.1rem; line-height: 1;
      border-radius: 5px; display: flex; align-items: center; justify-content: center;
      transition: background .13s, color .13s;
    }
    .q-add:hover { background: rgba(0,0,0,.07); color: var(--text); }

    .card-list {
      flex: 1;
      overflow-y: auto;
      padding: 7px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .card-list::-webkit-scrollbar { width: 3px; }
    .card-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .empty-hint {
      text-align: center;
      color: var(--muted);
      font-size: .76rem;
      padding: 20px 0;
      opacity: .6;
    }

    /* ── Card ────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 11px;
      cursor: grab;
      transition: box-shadow .13s, opacity .15s;
      user-select: none;
    }
    .card:active { cursor: grabbing; }
    .card:hover  { box-shadow: var(--shadow); }
    .card.dragging { opacity: .35; }
    .card.done { opacity: .55; }
    .card.done .card-title { text-decoration: line-through; color: var(--muted); }

    .card-top { display: flex; align-items: flex-start; gap: 7px; }
    .card-cb  {
      width: 15px; height: 15px; flex-shrink: 0;
      margin-top: 2px; cursor: pointer; accent-color: #6366f1;
    }
    .card-title { font-size: .8rem; font-weight: 600; flex: 1; line-height: 1.35; }

    .card-actions { display: flex; gap: 2px; opacity: 0; transition: opacity .13s; }
    .card:hover .card-actions { opacity: 1; }
    .card-act {
      background: none; border: none; cursor: pointer;
      font-size: .72rem; color: var(--muted);
      padding: 2px 4px; border-radius: 4px;
      transition: background .12s, color .12s;
    }
    .card-act:hover { background: rgba(0,0,0,.07); color: var(--text); }

    .card-desc {
      font-size: .72rem; color: var(--muted);
      margin-top: 5px; line-height: 1.4;
      padding-left: 22px;
    }

    .card-footer {
      display: flex; align-items: center; gap: 5px;
      margin-top: 6px; flex-wrap: wrap;
    }
    .tag-badge {
      font-size: .62rem; font-weight: 700;
      padding: 2px 6px; border-radius: 99px;
      text-transform: uppercase; letter-spacing: .04em;
      color: #fff;
    }
    .tag-pessoal { background: var(--tag-pessoal); }
    .tag-minha   { background: var(--tag-minha); }
    .tag-time    { background: var(--tag-time); }

    .owner-badge {
      font-size: .62rem; font-weight: 600;
      padding: 2px 6px; border-radius: 99px;
    }
    .owner-none { background: #fee2e2; color: #dc2626; }
    .owner-has  { background: #dcfce7; color: #16a34a; }

    .card-date { font-size: .6rem; color: var(--muted); margin-left: auto; }

    /* ── Modal overlay ───────────────────────────────── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.32);
      display: flex; align-items: center; justify-content: center;
      z-index: 200; padding: 16px;
      backdrop-filter: blur(2px);
    }
    .modal {
      background: var(--surface);
      border-radius: 12px;
      padding: 22px;
      width: 100%; max-width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,.16);
    }
    .modal-title { font-size: .95rem; font-weight: 700; margin-bottom: 16px; }

    .fg { margin-bottom: 12px; }
    .fg label { font-size: .7rem; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
    .fg input, .fg textarea, .fg select {
      width: 100%; font-size: .82rem;
      border: 1.5px solid var(--border);
      border-radius: 7px; padding: 7px 9px;
      background: var(--surface); color: var(--text);
      font-family: inherit; transition: border-color .13s;
    }
    .fg input:focus, .fg textarea:focus, .fg select:focus {
      outline: none; border-color: #6366f1;
    }
    .fg textarea { resize: vertical; min-height: 65px; }

    .tag-picker { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag-option {
      display: flex; align-items: center; gap: 4px;
      font-size: .75rem; font-weight: 600; cursor: pointer;
      padding: 5px 10px; border-radius: 99px;
      border: 2px solid transparent; transition: all .13s;
      color: var(--muted); border-color: var(--border);
    }
    .tag-option input { display: none; }
    .tag-option.sel-pessoal { background: var(--tag-pessoal); border-color: var(--tag-pessoal); color: #fff; }
    .tag-option.sel-minha   { background: var(--tag-minha);   border-color: var(--tag-minha);   color: #fff; }
    .tag-option.sel-time    { background: var(--tag-time);    border-color: var(--tag-time);    color: #fff; }

    .owner-row { display: flex; gap: 7px; }
    .owner-opt {
      flex: 1; text-align: center; padding: 7px;
      border-radius: 7px; border: 1.5px solid var(--border);
      font-size: .75rem; font-weight: 600; cursor: pointer;
      color: var(--muted); transition: all .13s;
    }
    .owner-opt.sel-has  { background: #dcfce7; border-color: #16a34a; color: #16a34a; }
    .owner-opt.sel-none { background: #fee2e2; border-color: #dc2626; color: #dc2626; }

    .modal-actions { display: flex; gap: 7px; justify-content: flex-end; margin-top: 18px; }
    .btn { padding: 7px 15px; border-radius: 7px; font-size: .8rem; font-weight: 600; cursor: pointer; border: none; transition: all .13s; font-family: inherit; }
    .btn-ghost   { background: none; border: 1.5px solid var(--border); color: var(--muted); }
    .btn-ghost:hover { border-color: var(--muted); color: var(--text); }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
    .btn-danger  { background: #fee2e2; color: #dc2626; }
    .btn-danger:hover { background: #fecaca; }

    /* archive modal */
    .arc-list { max-height: 280px; overflow-y: auto; margin: 10px 0; }
    .arc-item {
      padding: 7px 9px; border-radius: 6px;
      border: 1px solid var(--border); margin-bottom: 5px;
      font-size: .78rem; display: flex; align-items: center; gap: 7px;
    }
    .arc-q { font-size: .62rem; font-weight: 700; padding: 1px 6px; border-radius: 99px; color: #fff; }
    .arc-title { flex: 1; text-decoration: line-through; color: var(--muted); }
    .arc-date  { font-size: .6rem; color: var(--muted); }
    .arc-empty { text-align: center; color: var(--muted); font-size: .8rem; padding: 20px 0; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─────────────────────────────────────────── constants
const QUADRANTS = [
  { id: 1, icon: '🔥', title: 'Fazer Agora',  sub: 'Urgente + Importante',        color: '#d94f43' },
  { id: 2, icon: '📅', title: 'Agendar',       sub: 'Importante, não Urgente',      color: '#3478d4' },
  { id: 3, icon: '🤝', title: 'Delegar',        sub: 'Urgente, não Importante',      color: '#c97b1a' },
  { id: 4, icon: '🗑️', title: 'Eliminar',       sub: 'Nem Urgente, nem Importante',  color: '#9ca3af' },
];

const TAGS = [
  { id: 'pessoal', label: 'Pessoal', emoji: '🟦' },
  { id: 'minha',   label: 'Minha',   emoji: '🟩' },
  { id: 'time',    label: 'Time',    emoji: '🟧' },
];

// ─────────────────────────────────────────── helpers
const uid   = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
const load  = () => { try { return JSON.parse(localStorage.getItem('matrix_v1') || '[]'); } catch { return []; } };
const save  = d  => localStorage.setItem('matrix_v1', JSON.stringify(d));
const fmtDt = s  => new Date(s).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });

// ─────────────────────────────────────────── CardModal
function CardModal({ initial, defaultQ, onSave, onDelete, onClose }) {
  const [title, setTitle] = useState(initial?.title || '');
  const [desc,  setDesc]  = useState(initial?.description || '');
  const [tags,  setTags]  = useState(initial?.tags || []);
  const [qid,   setQid]   = useState(initial?.quadrant || defaultQ || 1);
  const [owner, setOwner] = useState(initial?.owner ?? null);
  const ref = useRef();

  useEffect(() => { ref.current?.focus(); }, []);

  const toggleTag = id => setTags(t => t.includes(id) ? t.filter(x => x !== id) : [...t, id]);

  const handleSave = () => {
    if (!title.trim()) return;
    onSave({
      id: initial?.id || uid(),
      title: title.trim(),
      description: desc.trim(),
      tags,
      quadrant: qid,
      owner: qid === 3 ? owner : null,
      done: initial?.done || false,
      createdAt: initial?.createdAt || new Date().toISOString(),
    });
    onClose();
  };

  const onKey = e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') handleSave();
    if (e.key === 'Escape') onClose();
  };

  return (
    <div className="overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal" onKeyDown={onKey}>
        <div className="modal-title">{initial ? 'Editar item' : 'Novo item'}</div>

        <div className="fg">
          <label>Título *</label>
          <input ref={ref} value={title} onChange={e => setTitle(e.target.value)}
            placeholder="O que precisa ser feito?" />
        </div>

        <div className="fg">
          <label>Descrição</label>
          <textarea value={desc} onChange={e => setDesc(e.target.value)}
            placeholder="Contexto, links, observações…" />
        </div>

        <div className="fg">
          <label>Quadrante</label>
          <select value={qid} onChange={e => setQid(Number(e.target.value))}>
            {QUADRANTS.map(q => <option key={q.id} value={q.id}>{q.icon} {q.title}</option>)}
          </select>
        </div>

        <div className="fg">
          <label>Origem da demanda</label>
          <div className="tag-picker">
            {TAGS.map(t => (
              <label key={t.id}
                className={`tag-option${tags.includes(t.id) ? ' sel-' + t.id : ''}`}>
                <input type="checkbox" checked={tags.includes(t.id)} onChange={() => toggleTag(t.id)} />
                {t.emoji} {t.label}
              </label>
            ))}
          </div>
        </div>

        {qid === 3 && (
          <div className="fg">
            <label>Responsável definido?</label>
            <div className="owner-row">
              <div className={`owner-opt${owner === 'has'  ? ' sel-has'  : ''}`}
                onClick={() => setOwner(owner === 'has'  ? null : 'has')}>
                ✅ Tem responsável
              </div>
              <div className={`owner-opt${owner === 'none' ? ' sel-none' : ''}`}
                onClick={() => setOwner(owner === 'none' ? null : 'none')}>
                ⚠️ Sem dono ainda
              </div>
            </div>
          </div>
        )}

        <div className="modal-actions">
          {initial && (
            <button className="btn btn-danger"
              onClick={() => { onDelete(initial.id); onClose(); }}>
              Excluir
            </button>
          )}
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
          <button className="btn btn-primary" onClick={handleSave} disabled={!title.trim()}>
            {initial ? 'Salvar' : 'Criar'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────── ArchiveModal
function ArchiveModal({ items, onConfirm, onClose }) {
  const done = items.filter(i => i.done);
  return (
    <div className="overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">Arquivar concluídos</div>
        <p style={{ fontSize: '.8rem', color: 'var(--muted)' }}>
          {done.length === 0
            ? 'Nenhum item marcado como concluído.'
            : `${done.length} item(s) serão removidos da matriz e salvos no arquivo local.`}
        </p>
        <div className="arc-list">
          {done.length === 0
            ? <div className="arc-empty">Tudo em aberto! 🎯</div>
            : done.map(i => {
                const q = QUADRANTS.find(x => x.id === i.quadrant);
                return (
                  <div key={i.id} className="arc-item">
                    <span className="arc-q" style={{ background: q.color }}>Q{i.quadrant}</span>
                    <span className="arc-title">{i.title}</span>
                    <span className="arc-date">{fmtDt(i.createdAt)}</span>
                  </div>
                );
              })}
        </div>
        <div className="modal-actions">
          <button className="btn btn-ghost" onClick={onClose}>Fechar</button>
          {done.length > 0 && (
            <button className="btn btn-primary" onClick={() => { onConfirm(); onClose(); }}>
              Arquivar {done.length}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ─────────────────────────────────────────── App
function App() {
  const [items,   setItems]   = useState(load);
  const [modal,   setModal]   = useState(null); // null | {type:'card',...} | {type:'archive'}
  const [filter,  setFilter]  = useState('all');
  const [dragging, setDragging] = useState(null); // item id being dragged
  const draggingRef = useRef(null);

  useEffect(() => { save(items); }, [items]);

  // global dragend cleanup
  useEffect(() => {
    const fn = () => { setDragging(null); draggingRef.current = null; };
    window.addEventListener('dragend', fn);
    return () => window.removeEventListener('dragend', fn);
  }, []);

  // ── mutations
  const upsert = item => setItems(p => {
    const i = p.findIndex(x => x.id === item.id);
    return i >= 0 ? p.map((x, j) => j === i ? item : x) : [...p, item];
  });

  const del    = id => setItems(p => p.filter(x => x.id !== id));
  const toggle = id => setItems(p => p.map(x => x.id === id ? { ...x, done: !x.done } : x));

  const drop = (itemId, targetQ) => setItems(p =>
    p.map(x => x.id === itemId ? { ...x, quadrant: targetQ, owner: targetQ === 3 ? x.owner : null } : x)
  );

  const archiveDone = () => {
    const archive = JSON.parse(localStorage.getItem('matrix_archive_v1') || '[]');
    localStorage.setItem('matrix_archive_v1', JSON.stringify([...archive, ...items.filter(i => i.done)]));
    setItems(p => p.filter(i => !i.done));
  };

  // ── view helpers
  const visible = filter === 'all' ? items : items.filter(i => i.tags.includes(filter));
  const qItems  = id => visible.filter(i => i.quadrant === id);
  const qCount  = id => items.filter(i => i.quadrant === id && !i.done).length;
  const tCount  = tid => items.filter(i => !i.done && i.tags.includes(tid)).length;

  // ── drag handlers
  const onDragStart = id => { setDragging(id); draggingRef.current = id; };

  // ── render quadrant
  function renderQ(q) {
    const [over, setOver] = useState(false);
    const list = qItems(q.id);

    return (
      <div
        key={q.id}
        className={`quadrant${over ? ' drag-over' : ''}`}
        data-q={q.id}
        onDragOver={e => { e.preventDefault(); setOver(true); }}
        onDragLeave={() => setOver(false)}
        onDrop={e => { e.preventDefault(); setOver(false); if (draggingRef.current) drop(draggingRef.current, q.id); }}
      >
        <div className="q-header">
          <span className="q-icon">{q.icon}</span>
          <div className="q-info">
            <div className="q-title">{q.title}</div>
            <div className="q-sub">{q.sub}</div>
          </div>
          <span className="q-count">{list.filter(i => !i.done).length}</span>
          <button className="q-add" title="Adicionar item"
            onClick={() => setModal({ type: 'card', defaultQ: q.id })}>＋</button>
        </div>

        <div className="card-list">
          {list.length === 0
            ? <div className="empty-hint">Sem itens aqui</div>
            : list.map(item => (
                <div
                  key={item.id}
                  className={`card${item.done ? ' done' : ''}${dragging === item.id ? ' dragging' : ''}`}
                  draggable
                  onDragStart={() => onDragStart(item.id)}
                >
                  <div className="card-top">
                    <input type="checkbox" className="card-cb"
                      checked={item.done}
                      onChange={() => toggle(item.id)}
                      onClick={e => e.stopPropagation()}
                    />
                    <span className="card-title">{item.title}</span>
                    <div className="card-actions">
                      <button className="card-act"
                        onClick={() => setModal({ type: 'card', item })}>✏️</button>
                    </div>
                  </div>

                  {item.description && (
                    <div className="card-desc">{item.description}</div>
                  )}

                  <div className="card-footer">
                    {item.tags.map(t => (
                      <span key={t} className={`tag-badge tag-${t}`}>
                        {TAGS.find(x => x.id === t)?.label}
                      </span>
                    ))}
                    {item.quadrant === 3 && item.owner === 'none' &&
                      <span className="owner-badge owner-none">⚠️ Sem dono</span>}
                    {item.quadrant === 3 && item.owner === 'has'  &&
                      <span className="owner-badge owner-has">✅ Delegado</span>}
                    <span className="card-date">{fmtDt(item.createdAt)}</span>
                  </div>
                </div>
              ))
          }
        </div>
      </div>
    );
  }

  const doneCount = items.filter(i => i.done).length;

  return (
    <>
      <div className="header">
        <div className="header-title">Matriz de <em>Prioridades</em></div>

        <div className="stats-row">
          {QUADRANTS.map(q => (
            <span key={q.id} className="stat-chip" style={{ color: q.color }}>
              {q.icon} {qCount(q.id)}
            </span>
          ))}
          {TAGS.map(t => {
            const color = t.id === 'pessoal' ? 'var(--tag-pessoal)' : t.id === 'minha' ? 'var(--tag-minha)' : 'var(--tag-time)';
            return (
              <span key={t.id} className="stat-chip" style={{ color }}>
                {t.emoji} {tCount(t.id)}
              </span>
            );
          })}
        </div>

        <div className="filter-bar">
          <span className="filter-label">Ver:</span>
          {[
            { id: 'all',     label: 'Todos' },
            { id: 'pessoal', label: '🟦 Pessoal' },
            { id: 'minha',   label: '🟩 Minha' },
            { id: 'time',    label: '🟧 Time' },
          ].map(f => (
            <button key={f.id}
              className={`filter-btn${filter === f.id ? ' active-' + f.id : ''}`}
              onClick={() => setFilter(f.id)}>
              {f.label}
            </button>
          ))}
        </div>

        <button className="archive-btn"
          onClick={() => setModal({ type: 'archive' })}>
          📦 Arquivar{doneCount > 0 ? ` (${doneCount})` : ''}
        </button>
      </div>

      <div className="matrix">
        {QUADRANTS.map(q => renderQ(q))}
      </div>

      {modal?.type === 'card' && (
        <CardModal
          initial={modal.item}
          defaultQ={modal.defaultQ || modal.item?.quadrant || 1}
          onSave={upsert}
          onDelete={del}
          onClose={() => setModal(null)}
        />
      )}

      {modal?.type === 'archive' && (
        <ArchiveModal
          items={items}
          onConfirm={archiveDone}
          onClose={() => setModal(null)}
        />
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
