<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organograma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #f4f4f5;
      --surface: #ffffff;
      --border:  #d1d5db;
      --border-l:#e5e7eb;
      --text:    #111827;
      --muted:   #6b7280;
      --subtle:  #9ca3af;
      --hdr:     #1f2937;
      --r: 8px;
      --sh: 0 1px 3px rgba(0,0,0,.08), 0 2px 8px rgba(0,0,0,.05);
      --fd: 'Space Grotesk', sans-serif;
      --fb: 'DM Sans', sans-serif;
    }
    body { font-family: var(--fb); background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: var(--hdr); padding: 32px 24px 28px; }
    .hdr { max-width: 1400px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    header h1 { font-family: var(--fd); font-size: 1.6rem; font-weight: 700; color: #fff; letter-spacing: -.3px; }
    header p  { margin-top: 6px; color: #9ca3af; font-size: .88rem; }
    .hdr-link { font-family: var(--fd); font-size: .8rem; color: #9ca3af; text-decoration: none; border: 1px solid #374151; border-radius: var(--r); padding: 6px 14px; transition: background .15s; }
    .hdr-link:hover { background: #374151; color: #fff; }

    .wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px 64px; }
    .card { background: var(--surface); border-radius: var(--r); box-shadow: var(--sh); border: 1px solid var(--border); padding: 22px 24px; margin-top: 20px; }
    .section-title { font-family: var(--fd); font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border-l); }

    .main-layout { display: grid; grid-template-columns: 340px 1fr; gap: 20px; align-items: start; margin-top: 20px; }
    @media(max-width: 960px) { .main-layout { grid-template-columns: 1fr; } }

    /* FORM */
    .fg { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .fg label { font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    input[type="text"], select {
      border: 1px solid var(--border); border-radius: var(--r);
      padding: 8px 11px; font-family: var(--fb); font-size: .9rem; color: var(--text);
      outline: none; transition: border-color .15s, box-shadow .15s; background: #fff; width: 100%;
    }
    input:focus, select:focus { border-color: #6b7280; box-shadow: 0 0 0 3px rgba(107,114,128,.12); }

    .btn { font-family: var(--fd); font-size: .82rem; font-weight: 600; padding: 8px 18px; border-radius: var(--r); border: none; cursor: pointer; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #1f2937; color: #fff; }
    .btn-ghost   { background: #fff; color: var(--muted); border: 1px solid var(--border); }
    .btn-danger  { background: #fff; color: #b91c1c; border: 1px solid #fecaca; }
    .btn-danger:hover { background: #fef2f2; }
    .btn-sm { padding: 5px 12px; font-size: .76rem; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }

    /* PEOPLE LIST */
    .people-list { display: flex; flex-direction: column; gap: 5px; max-height: 280px; overflow-y: auto; }
    .person-item { display: flex; align-items: center; gap: 8px; background: #f9fafb; border: 1px solid var(--border-l); border-radius: 6px; padding: 7px 10px; transition: background .15s; }
    .person-item:hover { background: #f3f4f6; }
    .person-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
    .person-info { flex: 1; min-width: 0; }
    .person-name { font-weight: 600; font-size: .85rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .person-role { font-size: .72rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .person-actions { display: flex; gap: 3px; flex-shrink: 0; }
    .icon-btn { background: none; border: none; cursor: pointer; color: var(--muted); padding: 3px 5px; border-radius: 4px; font-size: .78rem; transition: background .12s; }
    .icon-btn:hover { background: #e5e7eb; color: var(--text); }
    .icon-btn.del:hover { background: #fee2e2; color: #b91c1c; }

    /* SECTORS */
    .sector-list { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .sector-item { display: flex; align-items: center; gap: 8px; background: #f9fafb; border: 1px solid var(--border-l); border-radius: 6px; padding: 6px 10px; }
    .sector-swatch { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.08); }
    .sector-name { flex: 1; font-size: .85rem; font-weight: 600; color: var(--text); }
    .sector-count { font-size: .72rem; color: var(--subtle); white-space: nowrap; }
    .sector-add-row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
    .sector-add-row .fg { margin-bottom: 0; flex: 1; min-width: 120px; }

    /* CHART */
    .chart-card { overflow: auto; min-height: 320px; }
    #orgCanvas { display: block; }
    .chart-empty { text-align: center; padding: 60px 20px; color: var(--subtle); font-size: .92rem; font-style: italic; }
    .chart-toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .chart-toolbar span { font-size: .8rem; color: var(--muted); margin-right: 2px; }
    .zoom-btn { background: #f3f4f6; border: 1px solid var(--border); border-radius: 6px; padding: 4px 11px; font-size: .85rem; cursor: pointer; font-family: var(--fd); font-weight: 600; color: var(--text); }
    .zoom-btn:hover { background: #e5e7eb; }

    /* LEGEND */
    .legend-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-l); }
    .legend-title { font-family: var(--fd); font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 10px; }
    .legend-grid { display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .leg-i { display: flex; align-items: center; gap: 7px; font-size: .78rem; color: var(--text); }
    .leg-bar { width: 4px; height: 20px; border-radius: 2px; flex-shrink: 0; }
    .leg-info { display: flex; flex-direction: column; gap: 1px; }
    .leg-cargo { font-weight: 600; font-size: .78rem; color: var(--text); }
    .leg-names { font-size: .7rem; color: var(--muted); }

    .leg-sector-grid { display: flex; flex-wrap: wrap; gap: 8px 18px; }
    .leg-si { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--text); }
    .leg-swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.10); }

    .alert { border-radius: var(--r); padding: 9px 13px; font-size: .84rem; margin-top: 10px; display: none; }
    .alert.on { display: block; }
    .alert-err { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }

    .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 1000; align-items: center; justify-content: center; }
    .modal-bg.open { display: flex; }
    .modal { background: #fff; border-radius: var(--r); box-shadow: 0 8px 32px rgba(0,0,0,.18); padding: 26px 26px 22px; width: 100%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
    .modal h3 { font-family: var(--fd); font-size: 1rem; font-weight: 700; margin-bottom: 16px; }
    .modal .btn-row { margin-top: 16px; justify-content: flex-end; }

    /* color swatch picker for sector */
    .swatch-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
    .sw { width: 26px; height: 26px; border-radius: 5px; cursor: pointer; border: 2px solid transparent; transition: border-color .12s, transform .1s; }
    .sw:hover { transform: scale(1.12); }
    .sw.sel { border-color: #1f2937; }

    @media print {
      header p, .main-layout > div:first-child, .chart-toolbar, .hdr-link, .legend-section { display: none !important; }
      .main-layout { display: block; }
      body { background: #fff; }
      .card { box-shadow: none; border: none; padding: 0; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

<header>
  <div class="hdr">
    <div>
      <h1>Organograma</h1>
      <p>Monte a estrutura hierárquica da sua equipe ou empresa</p>
    </div>
    <a class="hdr-link" href="index.html">← Calendário de Obras</a>
  </div>
</header>

<div class="wrap">
  <div class="main-layout">

    <!-- LEFT PANEL -->
    <div>

      <!-- SETORES -->
      <div class="card">
        <div class="section-title">Setores / Quadros</div>
        <div class="sector-list" id="sectorList">
          <span style="color:var(--subtle);font-size:.82rem;font-style:italic;">Nenhum setor cadastrado.</span>
        </div>
        <div class="sector-add-row">
          <div class="fg">
            <label for="sNome">Nome do setor</label>
            <input type="text" id="sNome" placeholder="Ex: Produção" />
          </div>
          <div class="fg" style="max-width:90px;">
            <label>Cor</label>
            <div class="swatch-row" id="sectorSwatches"></div>
          </div>
          <button class="btn btn-primary btn-sm" style="align-self:flex-end;margin-bottom:1px;" onclick="addSector()">+ Setor</button>
        </div>
        <div class="alert alert-err" id="aSErr"></div>
      </div>

      <!-- ADICIONAR PESSOA -->
      <div class="card" style="margin-top:14px;">
        <div class="section-title">Adicionar Pessoa</div>

        <div class="fg">
          <label for="pNome">Nome completo</label>
          <input type="text" id="pNome" placeholder="Ex: Maria Silva" />
        </div>
        <div class="fg">
          <label for="pCargo">Cargo / Função</label>
          <input type="text" id="pCargo" placeholder="Ex: Engenheira Responsável" />
        </div>
        <div class="fg">
          <label for="pSetor">Setor</label>
          <select id="pSetor">
            <option value="">— Sem setor —</option>
          </select>
        </div>
        <div class="fg">
          <label for="pSuperior">Superior hierárquico</label>
          <select id="pSuperior">
            <option value="">— Raiz (topo da hierarquia) —</option>
          </select>
        </div>

        <div class="alert alert-err" id="aErr"></div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="savePerson()">Adicionar</button>
        </div>
      </div>

      <!-- LISTA -->
      <div class="card" style="margin-top:14px;">
        <div class="section-title">Equipe <span id="countBadge" style="font-weight:400;color:var(--muted);font-size:.76rem;"></span></div>
        <div class="people-list" id="peopleList">
          <span style="color:var(--subtle);font-size:.82rem;font-style:italic;">Nenhuma pessoa cadastrada.</span>
        </div>
        <div class="btn-row" style="margin-top:12px;">
          <button class="btn btn-ghost btn-sm" onclick="loadExample()">Carregar exemplo</button>
          <button class="btn btn-danger btn-sm" onclick="clearAll()">Limpar tudo</button>
        </div>
      </div>
    </div>

    <!-- RIGHT: CHART -->
    <div class="card chart-card">
      <div class="section-title">Organograma</div>

      <div class="chart-toolbar" id="chartToolbar" style="display:none;">
        <span>Zoom:</span>
        <button class="zoom-btn" onclick="zoom(-0.15)">−</button>
        <button class="zoom-btn" onclick="zoom(+0.15)">+</button>
        <button class="zoom-btn" onclick="resetZoom()">Ajustar</button>
        <button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="exportPNG()">Exportar PNG</button>
        <button class="btn btn-ghost btn-sm" onclick="window.print()">Imprimir</button>
      </div>

      <div class="chart-empty" id="chartEmpty">Adicione setores e pessoas para gerar o organograma.</div>
      <canvas id="orgCanvas" style="display:none;"></canvas>

      <!-- LEGENDA FUNÇÕES -->
      <div class="legend-section" id="legFuncoes" style="display:none;">
        <div class="legend-title">Funções / Cargos</div>
        <div class="legend-grid" id="legFuncoesGrid"></div>
      </div>

      <!-- LEGENDA SETORES -->
      <div class="legend-section" id="legSetores" style="display:none;">
        <div class="legend-title">Setores</div>
        <div class="leg-sector-grid" id="legSetoresGrid"></div>
      </div>
    </div>
  </div>
</div>

<!-- EDIT PERSON MODAL -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3>Editar Pessoa</h3>
    <div class="fg">
      <label for="mNome">Nome completo</label>
      <input type="text" id="mNome" />
    </div>
    <div class="fg">
      <label for="mCargo">Cargo / Função</label>
      <input type="text" id="mCargo" />
    </div>
    <div class="fg">
      <label for="mSetor">Setor</label>
      <select id="mSetor"></select>
    </div>
    <div class="fg">
      <label for="mSuperior">Superior hierárquico</label>
      <select id="mSuperior"></select>
    </div>
    <div class="alert alert-err" id="mErr"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveModal()">Salvar</button>
    </div>
  </div>
</div>

<script>
/* ─── SECTOR COLORS ─────────────────────────────────────────────────────────── */
const SECTOR_PALETTE = [
  { fill: 'rgba(219,234,254,.55)', border: '#93c5fd', label: '#1e40af' }, // azul
  { fill: 'rgba(220,252,231,.55)', border: '#86efac', label: '#166534' }, // verde
  { fill: 'rgba(254,243,199,.55)', border: '#fcd34d', label: '#92400e' }, // amarelo
  { fill: 'rgba(243,232,255,.55)', border: '#d8b4fe', label: '#6b21a8' }, // roxo
  { fill: 'rgba(255,228,230,.55)', border: '#fda4af', label: '#9f1239' }, // rosa
  { fill: 'rgba(204,251,241,.55)', border: '#5eead4', label: '#0f766e' }, // teal
  { fill: 'rgba(255,237,213,.55)', border: '#fdba74', label: '#9a3412' }, // laranja
  { fill: 'rgba(241,245,249,.70)', border: '#94a3b8', label: '#334155' }, // cinza
];
// hex swatches for the picker (matching palette above)
const SWATCH_HEX = ['#93c5fd','#86efac','#fcd34d','#d8b4fe','#fda4af','#5eead4','#fdba74','#94a3b8'];

/* ─── STATE ─────────────────────────────────────────────────────────────────── */
let sectors = [];  // { id, nome, palIdx }
let people  = [];  // { id, nome, cargo, setorId, superiorId }
let _sid = 1, _pid = 1;
let _zoom = 1;
let _editId = null;
let _sectorColor = 0; // index into SWATCH_HEX

/* ─── SECTOR SWATCH PICKER ──────────────────────────────────────────────────── */
function renderSwatchPicker(containerId, selIdx, onPick) {
  const el = document.getElementById(containerId);
  el.innerHTML = SWATCH_HEX.map((c, i) =>
    `<div class="sw${selIdx===i?' sel':''}" style="background:${c};" title="${c}"
      onclick="(${onPick.toString()})(${i})"></div>`
  ).join('');
}
function initSectorSwatches() {
  renderSwatchPicker('sectorSwatches', _sectorColor, function(i) {
    _sectorColor = i;
    document.querySelectorAll('#sectorSwatches .sw').forEach((e,j) => e.classList.toggle('sel', j===i));
  });
}

/* ─── SECTOR CRUD ───────────────────────────────────────────────────────────── */
function addSector() {
  const nome = document.getElementById('sNome').value.trim();
  const err  = document.getElementById('aSErr');
  if (!nome) { showErr(err, 'Informe o nome do setor.'); return; }
  if (sectors.find(s => s.nome.toLowerCase() === nome.toLowerCase())) { showErr(err, 'Já existe um setor com esse nome.'); return; }
  err.classList.remove('on');
  sectors.push({ id: _sid++, nome, palIdx: _sectorColor });
  document.getElementById('sNome').value = '';
  renderAll(); saveLocal();
}

function deleteSector(id) {
  if (!confirm('Remover setor? As pessoas deste setor ficarão sem setor.')) return;
  people.filter(p => p.setorId === id).forEach(p => p.setorId = null);
  sectors = sectors.filter(s => s.id !== id);
  renderAll(); saveLocal();
}

function renderSectorList() {
  const el = document.getElementById('sectorList');
  if (!sectors.length) {
    el.innerHTML = '<span style="color:var(--subtle);font-size:.82rem;font-style:italic;">Nenhum setor cadastrado.</span>';
    return;
  }
  el.innerHTML = sectors.map(s => {
    const pal = SECTOR_PALETTE[s.palIdx % SECTOR_PALETTE.length];
    const count = people.filter(p => p.setorId === s.id).length;
    return `<div class="sector-item">
      <div class="sector-swatch" style="background:${pal.fill};border-color:${pal.border};"></div>
      <span class="sector-name">${esc(s.nome)}</span>
      <span class="sector-count">${count} pessoa${count!==1?'s':''}</span>
      <button class="icon-btn del" onclick="deleteSector(${s.id})" title="Remover setor">✕</button>
    </div>`;
  }).join('');
}

function populateSetorSelect(selId, currentVal = '') {
  const sel = document.getElementById(selId);
  sel.innerHTML = '<option value="">— Sem setor —</option>';
  sectors.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.textContent = s.nome;
    if (String(s.id) === String(currentVal)) opt.selected = true;
    sel.appendChild(opt);
  });
}

/* ─── PERSON CRUD ───────────────────────────────────────────────────────────── */
function savePerson() {
  const nome    = document.getElementById('pNome').value.trim();
  const cargo   = document.getElementById('pCargo').value.trim();
  const setorId = document.getElementById('pSetor').value || null;
  const supId   = document.getElementById('pSuperior').value || null;
  const err     = document.getElementById('aErr');

  if (!nome)  { showErr(err, 'Informe o nome.'); return; }
  if (!cargo) { showErr(err, 'Informe o cargo/função.'); return; }
  err.classList.remove('on');

  people.push({
    id: _pid++, nome, cargo,
    setorId:   setorId ? Number(setorId) : null,
    superiorId: supId  ? Number(supId)   : null,
  });
  document.getElementById('pNome').value  = '';
  document.getElementById('pCargo').value = '';
  document.getElementById('pSetor').value = '';
  document.getElementById('pSuperior').value = '';
  renderAll(); saveLocal();
}

function openEdit(id) {
  const p = people.find(x => x.id === id);
  if (!p) return;
  _editId = id;
  document.getElementById('mNome').value  = p.nome;
  document.getElementById('mCargo').value = p.cargo;
  populateSetorSelect('mSetor', p.setorId);
  populateSupSelect('mSuperior', id, p.superiorId);
  document.getElementById('mErr').classList.remove('on');
  document.getElementById('editModal').classList.add('open');
}

function saveModal() {
  const nome    = document.getElementById('mNome').value.trim();
  const cargo   = document.getElementById('mCargo').value.trim();
  const setorId = document.getElementById('mSetor').value || null;
  const supId   = document.getElementById('mSuperior').value || null;
  const err     = document.getElementById('mErr');

  if (!nome)  { showErr(err, 'Informe o nome.'); return; }
  if (!cargo) { showErr(err, 'Informe o cargo/função.'); return; }

  const p = people.find(x => x.id === _editId);
  if (!p) return;
  p.nome = nome; p.cargo = cargo;
  p.setorId   = setorId ? Number(setorId) : null;
  p.superiorId = supId  ? Number(supId)   : null;
  fixCircular(_editId);
  closeModal(); renderAll(); saveLocal();
}

function closeModal() {
  document.getElementById('editModal').classList.remove('open');
  _editId = null;
}

function deletePerson(id) {
  if (!confirm('Remover esta pessoa?')) return;
  const p = people.find(x => x.id === id);
  people.filter(x => x.superiorId === id).forEach(x => x.superiorId = p ? p.superiorId : null);
  people = people.filter(x => x.id !== id);
  renderAll(); saveLocal();
}

function clearAll() {
  if (!confirm('Limpar todo o organograma (pessoas e setores)?')) return;
  people = []; sectors = []; _sid = 1; _pid = 1;
  renderAll(); saveLocal();
}

function fixCircular(id) {
  function descendants(pid) {
    const ch = people.filter(p => p.superiorId === pid).map(p => p.id);
    return ch.concat(ch.flatMap(c => descendants(c)));
  }
  const self = people.find(p => p.id === id);
  if (self && descendants(id).includes(self.superiorId)) self.superiorId = null;
}

function showErr(el, msg) { el.textContent = msg; el.classList.add('on'); }

/* ─── SUPERIOR SELECT ───────────────────────────────────────────────────────── */
function populateSupSelect(selId, excludeId = null, currentVal = '') {
  const sel = document.getElementById(selId);
  sel.innerHTML = '<option value="">— Raiz (topo da hierarquia) —</option>';
  people.filter(p => p.id !== excludeId).forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = `${p.nome} — ${p.cargo}`;
    if (String(p.id) === String(currentVal)) opt.selected = true;
    sel.appendChild(opt);
  });
}

/* ─── EXAMPLE DATA ──────────────────────────────────────────────────────────── */
function loadExample() {
  if ((people.length || sectors.length) && !confirm('Isso substituirá os dados atuais. Continuar?')) return;
  sectors = []; people = []; _sid = 1; _pid = 1;

  const addS = (nome, palIdx) => { sectors.push({ id: _sid++, nome, palIdx }); return _sid-1; };
  const addP = (nome, cargo, setorId, supId) => { people.push({ id: _pid++, nome, cargo, setorId, superiorId: supId }); return _pid-1; };

  const sDiretoria    = addS('Diretoria',    7);
  const sProducao     = addS('Produção',     0);
  const sPlanejamento = addS('Planejamento', 1);
  const sSSMA         = addS('SSMA',         4);
  const sQualidade    = addS('Qualidade',    2);
  const sAdmin        = addS('Administrativo', 5);

  const dir  = addP('Carlos Andrade',   'Diretor de Obras',           sDiretoria,    null);

/* ─── TREE LAYOUT ───────────────────────────────────────────────────────────── */
const NODE_W = 188;
const NODE_H = 68;
const H_GAP  = 28;
const V_GAP  = 54;
const SEC_PAD = 18; // padding inside sector box

function buildTree() {
  const nodeMap = {};
  people.forEach(p => { nodeMap[p.id] = { ...p, children: [] }; });
  people.forEach(p => {
    if (p.superiorId && nodeMap[p.superiorId]) nodeMap[p.superiorId].children.push(nodeMap[p.id]);
  });
  return people.filter(p => !p.superiorId || !nodeMap[p.superiorId]?.id || !people.find(x=>x.id===p.superiorId))
    .map(r => nodeMap[r.id]);
}

function layoutTree(roots) {
  const nodes = [];

  function subtreeWidth(node) {
    if (!node.children.length) { node._w = NODE_W; return NODE_W; }
    const total = node.children.reduce((s,c) => s + subtreeWidth(c), 0) + H_GAP*(node.children.length-1);
    node._w = Math.max(NODE_W, total);
    return node._w;
  }

  function place(node, x, y) {
    node._x = x + (node._w - NODE_W) / 2;
    node._y = y;
    nodes.push(node);
    if (!node.children.length) return;
    let cx = x;
    node.children.forEach(c => { place(c, cx, y + NODE_H + V_GAP); cx += c._w + H_GAP; });
  }

  let x = 0;
  roots.forEach(r => { subtreeWidth(r); place(r, x, 0); x += r._w + H_GAP * 2; });
  return nodes;
}

/* ─── SECTOR BOXES ──────────────────────────────────────────────────────────── */
function computeSectorBoxes(nodes) {
  const boxes = [];
  sectors.forEach(s => {
    const ns = nodes.filter(n => n.setorId === s.id);
    if (!ns.length) return;
    const x1 = Math.min(...ns.map(n => n._x)) - SEC_PAD;
    const y1 = Math.min(...ns.map(n => n._y)) - SEC_PAD - 18; // room for label
    const x2 = Math.max(...ns.map(n => n._x + NODE_W)) + SEC_PAD;
    const y2 = Math.max(...ns.map(n => n._y + NODE_H)) + SEC_PAD;
    boxes.push({ sector: s, x: x1, y: y1, w: x2-x1, h: y2-y1 });
  });
  return boxes;
}

/* ─── DRAW ──────────────────────────────────────────────────────────────────── */
function drawChart() {
  const canvas  = document.getElementById('orgCanvas');
  const empty   = document.getElementById('chartEmpty');
  const toolbar = document.getElementById('chartToolbar');

  if (!people.length) {
    canvas.style.display = 'none';
    empty.style.display  = '';
    toolbar.style.display = 'none';
    document.getElementById('legFuncoes').style.display = 'none';
    document.getElementById('legSetores').style.display = 'none';
    return;
  }
  empty.style.display   = 'none';
  toolbar.style.display = '';

  const roots = buildTree();
  const nodes = layoutTree(roots);
  const boxes = computeSectorBoxes(nodes);

  const pad = 50;
  const allX = [...nodes.map(n=>n._x), ...boxes.map(b=>b.x)];
  const allY = [...nodes.map(n=>n._y), ...boxes.map(b=>b.y)];
  const minX = Math.min(...allX);
  const minY = Math.min(...allY);
  const maxX = Math.max(...nodes.map(n=>n._x+NODE_W), ...boxes.map(b=>b.x+b.w));
  const maxY = Math.max(...nodes.map(n=>n._y+NODE_H), ...boxes.map(b=>b.y+b.h));

  const cw = (maxX - minX + pad*2) * _zoom;
  const ch = (maxY - minY + pad*2) * _zoom;

  canvas.width  = Math.max(cw, 200);
  canvas.height = Math.max(ch, 200);
  canvas.style.display = 'block';

  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.scale(_zoom, _zoom);
  const ox = -minX + pad;
  const oy = -minY + pad;

  // 1. SECTOR BOXES
  boxes.forEach(b => {
    const pal = SECTOR_PALETTE[b.sector.palIdx % SECTOR_PALETTE.length];
    const x = b.x + ox, y = b.y + oy;
    roundRect(ctx, x, y, b.w, b.h, 10);
    ctx.fillStyle = pal.fill;
    ctx.fill();
    roundRect(ctx, x, y, b.w, b.h, 10);
    ctx.strokeStyle = pal.border;
    ctx.lineWidth = 1.5;
    ctx.setLineDash([]);
    ctx.stroke();

    // sector label
    ctx.font = `700 11px 'Space Grotesk', sans-serif`;
    ctx.fillStyle = pal.label;
    ctx.fillText(b.sector.nome.toUpperCase(), x + 10, y + 13);
  });

  // 2. CONNECTORS
  ctx.strokeStyle = '#d1d5db';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([]);
  nodes.forEach(node => {
    if (!node.children.length) return;
    const px = node._x + ox + NODE_W/2;
    const py = node._y + oy + NODE_H;
    const midY = py + V_GAP/2;
    node.children.forEach(child => {
      const cx = child._x + ox + NODE_W/2;
      const cy = child._y + oy;
      ctx.beginPath();
      ctx.moveTo(px, py); ctx.lineTo(px, midY);
      ctx.lineTo(cx, midY); ctx.lineTo(cx, cy);
      ctx.stroke();
    });
  });

  // 3. NODE CARDS
  nodes.forEach(node => {
    const x = node._x + ox;
    const y = node._y + oy;
    const s = sectors.find(s => s.id === node.setorId);
    const pal = s ? SECTOR_PALETTE[s.palIdx % SECTOR_PALETTE.length] : null;
    const accentColor = pal ? pal.border : '#9ca3af';
    const bgColor = '#ffffff';

    ctx.shadowColor = 'rgba(0,0,0,.10)';
    ctx.shadowBlur  = 8;
    ctx.shadowOffsetY = 2;

    roundRect(ctx, x, y, NODE_W, NODE_H, 8);
    ctx.fillStyle = bgColor;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur  = 0;
    ctx.shadowOffsetY = 0;

    // left accent bar
    roundRect(ctx, x, y, 5, NODE_H, [8,0,0,8]);
    ctx.fillStyle = accentColor;
    ctx.fill();

    // border
    roundRect(ctx, x, y, NODE_W, NODE_H, 8);
    ctx.strokeStyle = '#e5e7eb';
    ctx.lineWidth = 1;
    ctx.stroke();

    // nome
    const tx = x + 14;
    ctx.fillStyle = '#111827';
    ctx.font = `600 12px 'DM Sans', sans-serif`;
    ctx.fillText(truncate(ctx, node.nome, NODE_W - 22), tx, y + 26);

    // cargo
    ctx.fillStyle = '#6b7280';
    ctx.font = `500 10.5px 'DM Sans', sans-serif`;
    ctx.fillText(truncate(ctx, node.cargo, NODE_W - 22), tx, y + 44);

    // setor badge (if no sector box — i.e. node alone)
    if (s) {
      ctx.fillStyle = '#9ca3af';
      ctx.font = `400 9px 'DM Sans', sans-serif`;
      ctx.fillText(truncate(ctx, s.nome, NODE_W - 22), tx, y + 59);
    }
  });

  ctx.restore();
  renderLegend(nodes);
}

/* ─── LEGEND ────────────────────────────────────────────────────────────────── */
function renderLegend(nodes) {
  // Funções: group by cargo, show color accent + names
  const cargoMap = {};
  people.forEach(p => {
    if (!cargoMap[p.cargo]) cargoMap[p.cargo] = { nomes: [], setorId: p.setorId };
    cargoMap[p.cargo].nomes.push(p.nome);
    if (!cargoMap[p.cargo].setorId) cargoMap[p.cargo].setorId = p.setorId;
  });

  const legF = document.getElementById('legFuncoes');
  const legFG = document.getElementById('legFuncoesGrid');
  const cargos = Object.keys(cargoMap);
  if (cargos.length) {
    legF.style.display = '';
    legFG.innerHTML = cargos.map(cargo => {
      const info = cargoMap[cargo];
      const s = sectors.find(x => x.id === info.setorId);
      const pal = s ? SECTOR_PALETTE[s.palIdx % SECTOR_PALETTE.length] : null;
      const barColor = pal ? pal.border : '#9ca3af';
      const nomes = info.nomes.join(', ');
      return `<div class="leg-i">
        <div class="leg-bar" style="background:${barColor};"></div>
        <div class="leg-info">
          <div class="leg-cargo">${esc(cargo)}</div>
          <div class="leg-names">${esc(nomes.length > 60 ? nomes.slice(0,58)+'…' : nomes)}</div>
        </div>
      </div>`;
    }).join('');
  } else {
    legF.style.display = 'none';
  }

  // Setores
  const legS = document.getElementById('legSetores');
  const legSG = document.getElementById('legSetoresGrid');
  const usedSectors = sectors.filter(s => people.some(p => p.setorId === s.id));
  if (usedSectors.length) {
    legS.style.display = '';
    legSG.innerHTML = usedSectors.map(s => {
      const pal = SECTOR_PALETTE[s.palIdx % SECTOR_PALETTE.length];
      const count = people.filter(p => p.setorId === s.id).length;
      return `<div class="leg-si">
        <div class="leg-swatch" style="background:${pal.fill};border-color:${pal.border};"></div>
        <span><strong>${esc(s.nome)}</strong> (${count})</span>
      </div>`;
    }).join('');
  } else {
    legS.style.display = 'none';
  }
}

/* ─── CANVAS HELPERS ────────────────────────────────────────────────────────── */
function roundRect(ctx, x, y, w, h, r) {
  if (typeof r === 'number') r = [r,r,r,r];
  const [tl,tr,br,bl] = r;
  ctx.beginPath();
  ctx.moveTo(x+tl, y);
  ctx.lineTo(x+w-tr, y); ctx.quadraticCurveTo(x+w, y, x+w, y+tr);
  ctx.lineTo(x+w, y+h-br); ctx.quadraticCurveTo(x+w, y+h, x+w-br, y+h);
  ctx.lineTo(x+bl, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-bl);
  ctx.lineTo(x, y+tl); ctx.quadraticCurveTo(x, y, x+tl, y);
  ctx.closePath();
}

function truncate(ctx, text, maxW) {
  if (ctx.measureText(text).width <= maxW) return text;
  let t = text;
  while (t.length > 0 && ctx.measureText(t+'…').width > maxW) t = t.slice(0,-1);
  return t + '…';
}

/* ─── ZOOM / EXPORT ─────────────────────────────────────────────────────────── */
function zoom(delta) { _zoom = Math.min(3, Math.max(0.25, _zoom+delta)); drawChart(); }
function resetZoom() { _zoom = 1; drawChart(); }

function exportPNG() {
  const canvas = document.getElementById('orgCanvas');
  if (!canvas || canvas.style.display==='none') return;
  const link = document.createElement('a');
  link.download = 'organograma.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

/* ─── PERSISTENCE ───────────────────────────────────────────────────────────── */
function saveLocal() {
  localStorage.setItem('org2_sectors', JSON.stringify(sectors));
  localStorage.setItem('org2_people',  JSON.stringify(people));
  localStorage.setItem('org2_sid',     _sid);
  localStorage.setItem('org2_pid',     _pid);
}
function loadLocal() {
  try {
    const s = localStorage.getItem('org2_sectors');
    const p = localStorage.getItem('org2_people');
    if (s) sectors = JSON.parse(s);
    if (p) people  = JSON.parse(p);
    _sid = Number(localStorage.getItem('org2_sid') || 1);
    _pid = Number(localStorage.getItem('org2_pid') || 1);
  } catch(e) {}
}

/* ─── UTILS ─────────────────────────────────────────────────────────────────── */
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
