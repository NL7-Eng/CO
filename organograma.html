<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Organograma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#f4f4f5;--surface:#fff;--border:#d1d5db;--border-l:#e5e7eb;
      --text:#111827;--muted:#6b7280;--subtle:#9ca3af;--hdr:#1f2937;
      --r:8px;--sh:0 1px 3px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.05);
      --fd:'Space Grotesk',sans-serif;--fb:'DM Sans',sans-serif;
    }
    body{font-family:var(--fb);background:var(--bg);color:var(--text);min-height:100vh}
    header{background:var(--hdr);padding:28px 24px}
    .hdr{max-width:1500px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:10px}
    header h1{font-family:var(--fd);font-size:1.5rem;font-weight:700;color:#fff;letter-spacing:-.3px}
    header p{margin-top:4px;color:#9ca3af;font-size:.86rem}
    .hdr-link{font-family:var(--fd);font-size:.78rem;color:#9ca3af;text-decoration:none;border:1px solid #374151;border-radius:var(--r);padding:5px 13px;transition:background .15s}
    .hdr-link:hover{background:#374151;color:#fff}
    .wrap{max-width:1500px;margin:0 auto;padding:0 14px 64px}

    /* LAYOUT */
    .layout{display:grid;grid-template-columns:440px 1fr;gap:16px;align-items:start;margin-top:16px}
    @media(max-width:1000px){.layout{grid-template-columns:1fr}}

    /* CARD */
    .card{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--border);padding:18px 20px}
    .sec-title{font-family:var(--fd);font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid var(--border-l)}

    /* TABS */
    .tab-bar{display:flex;border-bottom:1px solid var(--border-l);margin-bottom:16px;gap:0}
    .tab{font-family:var(--fd);font-size:.74rem;font-weight:600;color:var(--muted);padding:7px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;text-transform:uppercase;letter-spacing:.4px;transition:color .15s;user-select:none}
    .tab.on{color:var(--text);border-bottom-color:#1f2937}
    .pane{display:none}
    .pane.on{display:block}

    /* FORM FIELDS */
    .fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
    .fg label{font-size:.7rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
    input[type=text],input[type=number],select{
      border:1px solid var(--border);border-radius:var(--r);padding:7px 10px;
      font-family:var(--fb);font-size:.86rem;color:var(--text);
      outline:none;transition:border-color .15s,box-shadow .15s;background:#fff;width:100%
    }
    input:focus,select:focus{border-color:#6b7280;box-shadow:0 0 0 3px rgba(107,114,128,.12)}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

    /* BUTTONS */
    .btn{font-family:var(--fd);font-size:.8rem;font-weight:600;padding:7px 16px;border-radius:var(--r);border:none;cursor:pointer;transition:opacity .15s}
    .btn:hover{opacity:.85}
    .btn-primary{background:#1f2937;color:#fff}
    .btn-ghost{background:#fff;color:var(--muted);border:1px solid var(--border)}
    .btn-danger{background:#fff;color:#b91c1c;border:1px solid #fecaca}
    .btn-danger:hover{background:#fef2f2}
    .btn-xs{padding:3px 9px;font-size:.72rem}
    .btn-sm{padding:5px 12px;font-size:.76rem}
    .brow{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}

    /* ── ESTRUTURA TABLE ── */
    .level-section{margin-bottom:16px}
    .level-hdr{
      display:flex;align-items:center;gap:10px;
      background:#f9fafb;border:1px solid var(--border-l);border-radius:6px;
      padding:6px 12px;margin-bottom:6px;cursor:pointer;user-select:none
    }
    .level-badge{
      font-family:var(--fd);font-size:.7rem;font-weight:700;
      background:#1f2937;color:#fff;border-radius:20px;padding:2px 9px;white-space:nowrap
    }
    .level-label{font-family:var(--fd);font-size:.78rem;font-weight:600;color:var(--muted);flex:1}
    .level-count{font-size:.72rem;color:var(--subtle)}
    .level-add-btn{
      font-family:var(--fd);font-size:.7rem;font-weight:700;
      background:none;border:1px solid var(--border);border-radius:5px;
      padding:2px 8px;cursor:pointer;color:var(--muted);transition:background .12s
    }
    .level-add-btn:hover{background:#f3f4f6;color:var(--text)}

    .struct-table{width:100%;border-collapse:collapse;font-size:.8rem}
    .struct-table th{
      font-family:var(--fd);font-size:.66rem;font-weight:700;color:var(--muted);
      text-transform:uppercase;letter-spacing:.4px;padding:5px 8px;
      border-bottom:1px solid var(--border-l);text-align:left;background:#fafafa
    }
    .struct-table td{padding:6px 8px;border-bottom:1px solid var(--border-l);vertical-align:middle}
    .struct-table tr:last-child td{border-bottom:none}
    .struct-table tr:hover td{background:#f9fafb}
    .p-nome{font-weight:700;font-size:.8rem;color:var(--text);text-transform:uppercase}
    .p-cargo{font-size:.72rem;color:var(--muted);margin-top:1px}
    .grp-chip{
      display:inline-flex;align-items:center;gap:4px;
      font-size:.68rem;font-weight:600;padding:2px 7px;border-radius:20px;
      border:1px solid;white-space:nowrap
    }
    .sup-chip{font-size:.68rem;color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;display:inline-block}
    .act-cell{display:flex;gap:4px;justify-content:flex-end}
    .iBtn{background:none;border:none;cursor:pointer;color:var(--muted);padding:3px 5px;border-radius:4px;font-size:.78rem}
    .iBtn:hover{background:#e5e7eb;color:var(--text)}
    .iBtn.del:hover{background:#fee2e2;color:#b91c1c}

    /* inline add form in level */
    .inline-form{
      background:#f9fafb;border:1px solid var(--border-l);border-radius:7px;
      padding:12px 14px;margin-bottom:8px;display:none
    }
    .inline-form.open{display:block}

    /* empty state */
    .empty-msg{color:var(--subtle);font-size:.82rem;font-style:italic;padding:8px 4px}

    /* ── CADASTRO ── */
    .cad-section{margin-bottom:18px}
    .cad-sec-title{font-family:var(--fd);font-size:.72rem;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
    .tag-list{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;margin-bottom:8px}
    .tag{
      display:inline-flex;align-items:center;gap:5px;
      font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:20px;
      background:#f3f4f6;border:1px solid var(--border-l);color:var(--text);
      cursor:default
    }
    .tag-x{background:none;border:none;cursor:pointer;color:var(--subtle);font-size:.72rem;padding:0 1px;line-height:1}
    .tag-x:hover{color:#b91c1c}
    .grp-tag{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:600;padding:3px 10px 3px 6px;border-radius:20px;border:1.5px solid;cursor:default}
    .grp-bar{width:10px;height:10px;border-radius:2px;flex-shrink:0}

    /* swatches */
    .swatches{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
    .sw{width:22px;height:22px;border-radius:4px;cursor:pointer;border:2.5px solid transparent;transition:border-color .12s,transform .1s}
    .sw:hover{transform:scale(1.12)}
    .sw.sel{border-color:#1f2937}

    /* ── CHART ── */
    .chart-card{overflow:auto;min-height:360px}
    #orgCanvas{display:block}
    .chart-empty{text-align:center;padding:70px 20px;color:var(--subtle);font-size:.9rem;font-style:italic}
    .toolbar{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
    .toolbar span{font-size:.78rem;color:var(--muted);margin-right:2px}
    .zb{background:#f3f4f6;border:1px solid var(--border);border-radius:5px;padding:3px 11px;font-size:.86rem;cursor:pointer;font-family:var(--fd);font-weight:600;color:var(--text)}
    .zb:hover{background:#e5e7eb}

    /* LEGEND */
    .leg-section{margin-top:14px;padding-top:12px;border-top:1px solid var(--border-l)}
    .leg-title{font-family:var(--fd);font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
    .leg-grid{display:flex;flex-wrap:wrap;gap:8px 16px}
    .leg-i{display:flex;align-items:center;gap:6px;font-size:.75rem}
    .leg-bar{width:4px;height:24px;border-radius:2px;flex-shrink:0}
    .leg-inf{display:flex;flex-direction:column;gap:1px}
    .leg-cargo{font-weight:600;color:var(--text);font-size:.75rem}
    .leg-names{font-size:.67rem;color:var(--muted)}

    /* ALERT */
    .alert{border-radius:var(--r);padding:8px 12px;font-size:.82rem;margin-top:8px;display:none}
    .alert.on{display:block}
    .alert-err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}

    /* MODAL */
    .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center}
    .modal-bg.open{display:flex}
    .modal{background:#fff;border-radius:var(--r);box-shadow:0 8px 32px rgba(0,0,0,.18);padding:22px;width:100%;max-width:460px;max-height:92vh;overflow-y:auto}
    .modal h3{font-family:var(--fd);font-size:.95rem;font-weight:700;margin-bottom:14px}
    .modal .brow{justify-content:flex-end}

    @media print{
      header p,.layout>div:first-child,.toolbar,.hdr-link,.leg-section{display:none!important}
      .layout{display:block}
      body{background:#fff}
      .card{box-shadow:none;border:none;padding:0}
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
  </style>
</head>
<body>

<header>
  <div class="hdr">
    <div>
      <h1>Organograma</h1>
      <p>Defina a estrutura hierárquica, funções e grupos da equipe</p>
    </div>
    <a class="hdr-link" href="index.html">← Calendário de Obras</a>
  </div>
</header>

<div class="wrap">
<div class="layout">

<!-- ══════════ PAINEL ESQUERDO ══════════ -->
<div>
<div class="card">
  <div class="tab-bar">
    <div class="tab on"  id="tab-est" onclick="showTab('est')">Estrutura</div>
    <div class="tab"     id="tab-cad" onclick="showTab('cad')">Cadastro</div>
  </div>

  <!-- ─── ABA ESTRUTURA ─── -->
  <div class="pane on" id="pane-est">

    <!-- mini form para adicionar no nível selecionado -->
    <div class="inline-form" id="addForm">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <span id="addFormTitle" style="font-family:var(--fd);font-size:.8rem;font-weight:700;color:var(--text);">Nova pessoa</span>
        <button class="iBtn" onclick="closeAddForm()">✕</button>
      </div>
      <div class="fg">
        <label>Nome completo</label>
        <input type="text" id="fNome" placeholder="Ex: João Silva" />
      </div>
      <div class="row2">
        <div class="fg">
          <label>Cargo / Função</label>
          <select id="fCargo"></select>
        </div>
        <div class="fg">
          <label>Grupo / Setor</label>
          <select id="fSetor"></select>
        </div>
      </div>
      <div class="row2">
        <div class="fg">
          <label>Nível</label>
          <select id="fNivel" onchange="onNivelChange()">
            <option value="1">Nível 1 (Topo)</option>
            <option value="2">Nível 2</option>
            <option value="3">Nível 3</option>
            <option value="4">Nível 4</option>
            <option value="5">Nível 5</option>
          </select>
        </div>
        <div class="fg">
          <label>Reporta a</label>
          <select id="fSuperior"></select>
        </div>
      </div>
      <div class="fg" id="fgCargoCustom" style="display:none;">
        <label>Cargo personalizado</label>
        <input type="text" id="fCargoCustom" placeholder="Digite o cargo" />
      </div>
      <div class="alert alert-err" id="aFErr"></div>
      <div class="brow">
        <button class="btn btn-ghost btn-sm" onclick="closeAddForm()">Cancelar</button>
        <button class="btn btn-primary btn-sm" onclick="savePerson()">Adicionar</button>
      </div>
    </div>

    <!-- controles topo -->
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" onclick="openAddForm(null)">+ Pessoa</button>
      <button class="btn btn-ghost btn-sm" onclick="loadExample()">Carregar exemplo</button>
      <span style="flex:1"></span>
      <span id="countBadge" style="font-size:.76rem;color:var(--muted);"></span>
      <button class="btn btn-danger btn-xs" onclick="clearPeople()">Limpar</button>
    </div>

    <!-- tabela por nível -->
    <div id="structBody"></div>

  </div><!-- /pane-est -->

  <!-- ─── ABA CADASTRO ─── -->
  <div class="pane" id="pane-cad">

    <!-- FUNÇÕES -->
    <div class="cad-section">
      <div class="cad-sec-title">Funções</div>
      <div class="tag-list" id="funcTagList"></div>
      <div style="display:flex;gap:7px;align-items:flex-end;">
        <div class="fg" style="flex:1;margin-bottom:0;">
          <label for="newFunc">Nova função</label>
          <input type="text" id="newFunc" placeholder="Ex: ANALISTA DE DADOS" />
        </div>
        <button class="btn btn-primary btn-sm" onclick="addFuncao()" style="align-self:flex-end;margin-bottom:1px;">+</button>
      </div>
      <div class="alert alert-err" id="aFuncErr"></div>
    </div>

    <div style="border-top:1px solid var(--border-l);margin:14px 0 16px;"></div>

    <!-- GRUPOS -->
    <div class="cad-section">
      <div class="cad-sec-title">Grupos / Setores</div>
      <div class="tag-list" id="grpTagList"></div>
      <div class="row2" style="margin-top:4px;">
        <div class="fg" style="margin-bottom:0;">
          <label for="newGrp">Nome do grupo</label>
          <input type="text" id="newGrp" placeholder="Ex: Jurídico" />
        </div>
        <div class="fg" style="margin-bottom:0;">
          <label>Cor</label>
          <div class="swatches" id="grpSwatches"></div>
        </div>
      </div>
      <div class="brow">
        <button class="btn btn-primary btn-sm" onclick="addGrupo()">+ Grupo</button>
      </div>
      <div class="alert alert-err" id="aGrpErr"></div>
    </div>

  </div><!-- /pane-cad -->

</div><!-- /card -->
</div>

<!-- ══════════ PAINEL DIREITO: ORGANOGRAMA ══════════ -->
<div class="card chart-card">
  <div class="sec-title">Organograma</div>
  <div class="toolbar" id="toolbar" style="display:none;">
    <span>Zoom:</span>
    <button class="zb" onclick="zoom(-.15)">−</button>
    <button class="zb" onclick="zoom(+.15)">+</button>
    <button class="zb" onclick="resetZoom()">Ajustar</button>
    <button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="exportPNG()">Exportar PNG</button>
    <button class="btn btn-ghost btn-sm" onclick="window.print()">Imprimir</button>
  </div>
  <div class="chart-empty" id="chartEmpty">Adicione pessoas na aba Estrutura para gerar o organograma.</div>
  <canvas id="orgCanvas" style="display:none;"></canvas>

  <div class="leg-section" id="legGroups" style="display:none;">
    <div class="leg-title">Grupos / Setores</div>
    <div class="leg-grid" id="legGroupsGrid"></div>
  </div>
  <div class="leg-section" id="legFuncs" style="display:none;">
    <div class="leg-title">Funções</div>
    <div class="leg-grid" id="legFuncsGrid"></div>
  </div>
</div>

</div><!-- /layout -->
</div><!-- /wrap -->

<!-- EDIT MODAL -->
<div class="modal-bg" id="editModal">
  <div class="modal">
    <h3>Editar Pessoa</h3>
    <div class="fg"><label>Nome</label><input type="text" id="mNome" /></div>
    <div class="row2">
      <div class="fg"><label>Cargo / Função</label><select id="mCargo" onchange="onMCargoChange()"></select></div>
      <div class="fg"><label>Grupo / Setor</label><select id="mSetor"></select></div>
    </div>
    <div class="fg" id="fgMCargoCustom" style="display:none;"><label>Cargo personalizado</label><input type="text" id="mCargoCustom" /></div>
    <div class="row2">
      <div class="fg"><label>Nível</label><select id="mNivel" onchange="onMNivelChange()">
        <option value="1">Nível 1 (Topo)</option>
        <option value="2">Nível 2</option><option value="3">Nível 3</option>
        <option value="4">Nível 4</option><option value="5">Nível 5</option>
      </select></div>
      <div class="fg"><label>Reporta a</label><select id="mSuperior"></select></div>
    </div>
    <div class="alert alert-err" id="mErr"></div>
    <div class="brow">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveModal()">Salvar</button>
    </div>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════════════════════
   PALETTE
   ══════════════════════════════════════════════════════════════════════════ */
const PAL = [
  {fill:'rgba(219,234,254,.45)',border:'#3b82f6',label:'#1d4ed8'},
  {fill:'rgba(220,252,231,.45)',border:'#22c55e',label:'#166534'},
  {fill:'rgba(254,243,199,.45)',border:'#eab308',label:'#854d0e'},
  {fill:'rgba(243,232,255,.45)',border:'#a855f7',label:'#6b21a8'},
  {fill:'rgba(255,228,230,.45)',border:'#f43f5e',label:'#9f1239'},
  {fill:'rgba(204,251,241,.45)',border:'#14b8a6',label:'#0f766e'},
  {fill:'rgba(255,237,213,.45)',border:'#f97316',label:'#9a3412'},
  {fill:'rgba(241,245,249,.65)',border:'#64748b',label:'#334155'},
  {fill:'rgba(240,253,244,.45)',border:'#16a34a',label:'#14532d'},
];
const SW_HEX = PAL.map(p=>p.border);

/* ══════════════════════════════════════════════════════════════════════════════
   DEFAULT CATALOG
   ══════════════════════════════════════════════════════════════════════════ */
const DEFAULT_FUNCOES = [
  'GERENTE DE CONTRATOS','ENGENHEIRO DE OBRAS','ENGENHEIRO DE PLANEJAMENTO',
  'TECNICO DE PLANEJAMENTO','TECNICO DE MEDIÇÃO','TOPOGRAFO','AUXILIAR DE TOPOGRAFIA',
  'ANALISTA DE ENGENHARIA','LABORATORISTA','AUXILIAR DE LABORATORISTA',
  'GERENTE ADMINISTRATIVO','ENCARREGADO ADMINISTRATIVO','AUXILIAR ADMINISTRATIVO',
  'ENGENHEIRO SEG DO TRABALHO','TECNICO SEG DO TRABALHO','MEDICO DO TRABALHO',
  'TECNICO ENF DO TRABALHO','ANALISTA DE MEIO AMBIENTE','TECNICO DE MEIO AMBIENTE',
  'ASSISTENTE ADM. MEIO AMBIENTE','ENGENHEIRO TRAINEE','SUPERVISOR DE OBRAS',
  'MESTRE DE OBRA','ENCARREGADO DE OBRAS','MOTORISTA DE COMBOIO','MECANICO',
  'ALMOXARIFE','AUXILIAR DE ALMOXARIFADO','VIGIA','ELETRICISTA','MOTORISTA DE MUNCK',
  'AUXILIAR DE SERVIÇOS GERAIS','MOTORISTA VEICULOS LEVES','MOTORISTA DE ONIBUS','MARINHEIRO',
];
const DEFAULT_GRUPOS = [
  {nome:'Gestão Contratual',palIdx:0},
  {nome:'Engenharia',palIdx:1},
  {nome:'Planejamento / Medição',palIdx:3},
  {nome:'Produção',palIdx:8},
  {nome:'Qualidade / Laboratório',palIdx:2},
  {nome:'Administração',palIdx:5},
  {nome:'SSMA',palIdx:4},
  {nome:'Apoio Operacional',palIdx:6},
  {nome:'Administração / Apoio Operacional e Logístico',palIdx:7},
];

/* ══════════════════════════════════════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════════════════════════════════ */
let funcoes = [];         // string[]
let grupos  = [];         // {id,nome,palIdx}
let people  = [];         // {id,nome,cargo,grupoId,superiorId}
let _gid=1,_pid=1;
let _zoom=1;
let _editId=null;
let _addLevel=1;          // which level the inline form is targeting
let _swColor=0;           // selected swatch for new group

/* ══════════════════════════════════════════════════════════════════════════════
   TABS
   ══════════════════════════════════════════════════════════════════════════ */
function showTab(id){
  ['est','cad'].forEach(t=>{
    document.getElementById('pane-'+t).classList.toggle('on',t===id);
    document.getElementById('tab-'+t).classList.toggle('on',t===id);
  });
}

/* ══════════════════════════════════════════════════════════════════════════════
   COMPUTED LEVEL
   ══════════════════════════════════════════════════════════════════════════ */
function getNivel(pid,visited=new Set()){
  if(!pid) return 0;
  if(visited.has(pid)) return 1; // break cycles
  visited.add(pid);
  const p=people.find(x=>x.id===pid);
  if(!p||!p.superiorId) return 1;
  return getNivel(p.superiorId,visited)+1;
}

/* ══════════════════════════════════════════════════════════════════════════════
   ADD FORM
   ══════════════════════════════════════════════════════════════════════════ */
function openAddForm(targetLevel){
  _addLevel = targetLevel||1;
  document.getElementById('fNome').value='';

function populateCargoSel(selId,cur=''){
  const sel=document.getElementById(selId); if(!sel) return;
  sel.innerHTML='<option value="">— Selecione —</option>'+
    funcoes.map(f=>`<option value="${esc(f)}"${cur===f?' selected':''}>${esc(f)}</option>`).join('')+
    '<option value="__OUTRO__"'+(cur==='__OUTRO__'?' selected':'')+'>Outro (digitar)…</option>';
  if(cur&&funcoes.includes(cur)) sel.value=cur;
}

function populateGrupoSel(selId,cur=''){
  const sel=document.getElementById(selId); if(!sel) return;
  sel.innerHTML='<option value="">— Sem grupo —</option>'+
    grupos.map(g=>`<option value="${g.id}"${String(g.id)===String(cur)?' selected':''}>${esc(g.nome)}</option>`).join('');
}

function updateSupSelect(supSelId,nivelSelId,excludeId){
  const nivel=Number(document.getElementById(nivelSelId)?.value||1);
  const sel=document.getElementById(supSelId); if(!sel) return;
  if(nivel<=1){ sel.innerHTML='<option value="">— Raiz (sem superior) —</option>'; return; }
  const parentLevel=nivel-1;
  const candidates=people.filter(p=>p.id!==excludeId&&getNivel(p.id)===parentLevel);
  sel.innerHTML='<option value="">— Selecione o superior —</option>'+
    candidates.map(p=>`<option value="${p.id}">${esc(p.nome)} (${esc(p.cargo)})</option>`).join('');
}

function getCargoVal(selId,customId){
  const v=document.getElementById(selId)?.value;
  if(v==='__OUTRO__') return (document.getElementById(customId)?.value||'').trim().toUpperCase();
  return v||'';
}

function savePerson(){
  const nome   = document.getElementById('fNome').value.trim().toUpperCase();
  const cargo  = getCargoVal('fCargo','fCargoCustom');
  const grupoId= document.getElementById('fSetor').value||null;
  const nivel  = Number(document.getElementById('fNivel').value||1);
  const supId  = nivel>1?(document.getElementById('fSuperior').value||null):null;
  const err=document.getElementById('aFErr');
  if(!nome){ showErr(err,'Informe o nome.'); return; }
  if(!cargo){ showErr(err,'Informe o cargo/função.'); return; }
  if(nivel>1&&!supId){ showErr(err,'Selecione quem esta pessoa reporta.'); return; }
  err.classList.remove('on');
  people.push({id:_pid++,nome,cargo,grupoId:grupoId?Number(grupoId):null,superiorId:supId?Number(supId):null});
  closeAddForm();
  renderAll(); saveLocal();
}

function openEdit(id){
  const p=people.find(x=>x.id===id); if(!p) return;
  _editId=id;
  document.getElementById('mNome').value=p.nome;
  populateCargoSel('mCargo',p.cargo);
  document.getElementById('fgMCargoCustom').style.display='none';
  if(!funcoes.includes(p.cargo)){
    document.getElementById('mCargo').value='__OUTRO__';
    document.getElementById('mCargoCustom').value=p.cargo;
    document.getElementById('fgMCargoCustom').style.display='';
  }
  populateGrupoSel('mSetor',p.grupoId);
  const lvl=getNivel(id);
  document.getElementById('mNivel').value=String(lvl);
  updateSupSelect('mSuperior','mNivel',id);
  if(p.superiorId) document.getElementById('mSuperior').value=String(p.superiorId);
  document.getElementById('mErr').classList.remove('on');
  document.getElementById('editModal').classList.add('open');
}

function saveModal(){
  const nome   = document.getElementById('mNome').value.trim().toUpperCase();
  const cargo  = getCargoVal('mCargo','mCargoCustom');
  const grupoId= document.getElementById('mSetor').value||null;
  const nivel  = Number(document.getElementById('mNivel').value||1);
  const supId  = nivel>1?(document.getElementById('mSuperior').value||null):null;
  const err=document.getElementById('mErr');
  if(!nome){ showErr(err,'Informe o nome.'); return; }
  if(!cargo){ showErr(err,'Informe o cargo.'); return; }
  if(nivel>1&&!supId){ showErr(err,'Selecione quem esta pessoa reporta.'); return; }
  const p=people.find(x=>x.id===_editId); if(!p) return;
  p.nome=nome; p.cargo=cargo;
  p.grupoId=grupoId?Number(grupoId):null;
  p.superiorId=supId?Number(supId):null;
  fixCircular(_editId);
  closeModal(); renderAll(); saveLocal();
}

function closeModal(){
  document.getElementById('editModal').classList.remove('open');
  document.getElementById('fgMCargoCustom').style.display='none';
  _editId=null;
}

function deletePerson(id){
  if(!confirm('Remover esta pessoa?')) return;
  const p=people.find(x=>x.id===id);
  people.filter(x=>x.superiorId===id).forEach(x=>x.superiorId=p?p.superiorId:null);
  people=people.filter(x=>x.id!==id);
  renderAll(); saveLocal();
}

function clearPeople(){
  if(!confirm('Limpar toda a equipe do organograma?')) return;
  people=[]; _pid=1; renderAll(); saveLocal();
}

function fixCircular(id){
  function desc(pid){ const ch=people.filter(p=>p.superiorId===pid).map(p=>p.id); return ch.concat(ch.flatMap(c=>desc(c))); }
  const self=people.find(p=>p.id===id);
  if(self&&desc(id).includes(self.superiorId)) self.superiorId=null;
}

/* ══════════════════════════════════════════════════════════════════════════════
   TREE LAYOUT + DRAW
   ══════════════════════════════════════════════════════════════════════════ */
const NW=196,NH=72,HG=28,VG=52;

function buildTree(){
  const map={};
  people.forEach(p=>{map[p.id]={...p,children:[]};});
  people.forEach(p=>{ if(p.superiorId&&map[p.superiorId]) map[p.superiorId].children.push(map[p.id]); });
  return people.filter(p=>!p.superiorId||!map[p.superiorId]).map(r=>map[r.id]);
}
function layout(roots){
  const nodes=[];
  function sw(n){ if(!n.children.length){n._w=NW;return NW;} const t=n.children.reduce((s,c)=>s+sw(c),0)+HG*(n.children.length-1); n._w=Math.max(NW,t);return n._w; }
  function pl(n,x,y){ n._x=x+(n._w-NW)/2;n._y=y;nodes.push(n);if(!n.children.length)return;let cx=x;n.children.forEach(c=>{pl(c,cx,y+NH+VG);cx+=c._w+HG;}); }
  let x=0;roots.forEach(r=>{sw(r);pl(r,x,0);x+=r._w+HG*2;});
  return nodes;
}

function drawChart(){
  const canvas=document.getElementById('orgCanvas');
  const empty=document.getElementById('chartEmpty');
  const tb=document.getElementById('toolbar');
  if(!people.length){
    canvas.style.display='none';empty.style.display='';tb.style.display='none';
    document.getElementById('legGroups').style.display='none';
    document.getElementById('legFuncs').style.display='none';
    return;
  }
  empty.style.display='none';tb.style.display='';

  const roots=buildTree();
  const nodes=layout(roots);
  const pad=48;
  const minX=Math.min(...nodes.map(n=>n._x));
  const minY=Math.min(...nodes.map(n=>n._y));
  const maxX=Math.max(...nodes.map(n=>n._x+NW));
  const maxY=Math.max(...nodes.map(n=>n._y+NH));

  canvas.width=Math.max((maxX-minX+pad*2)*_zoom,200);
  canvas.height=Math.max((maxY-minY+pad*2)*_zoom,200);
  canvas.style.display='block';

  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save(); ctx.scale(_zoom,_zoom);
  const ox=-minX+pad,oy=-minY+pad;

  // connectors
  ctx.strokeStyle='#d1d5db';ctx.lineWidth=1.5;ctx.setLineDash([]);
  nodes.forEach(n=>{
    if(!n.children.length) return;
    const px=n._x+ox+NW/2,py=n._y+oy+NH,my=py+VG/2;
    n.children.forEach(c=>{
      const cx=c._x+ox+NW/2,cy=c._y+oy;
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px,my);ctx.lineTo(cx,my);ctx.lineTo(cx,cy);ctx.stroke();
    });
  });

  // cards
  nodes.forEach(n=>{
    const x=n._x+ox,y=n._y+oy;
    const g=grupos.find(g=>g.id===n.grupoId);
    const pal=g?PAL[g.palIdx%PAL.length]:null;
    const accent=pal?pal.border:'#d1d5db';

    ctx.shadowColor='rgba(0,0,0,.09)';ctx.shadowBlur=8;ctx.shadowOffsetY=2;
    rr(ctx,x,y,NW,NH,8);ctx.fillStyle='#fff';ctx.fill();
    ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;

    rr(ctx,x,y,5,NH,[8,0,0,8]);ctx.fillStyle=accent;ctx.fill();
    rr(ctx,x,y,NW,NH,8);ctx.strokeStyle='#e5e7eb';ctx.lineWidth=1;ctx.stroke();

    const tx=x+12;
    ctx.fillStyle='#111827';ctx.font='700 11.5px "DM Sans",sans-serif';
    ctx.fillText(trunc(ctx,n.nome,NW-18),tx,y+22);
    ctx.fillStyle='#6b7280';ctx.font='500 10px "DM Sans",sans-serif';
    ctx.fillText(trunc(ctx,n.cargo,NW-18),tx,y+38);
    if(g){
      ctx.fillStyle=accent;ctx.font='600 9px "DM Sans",sans-serif';
      ctx.fillText(trunc(ctx,g.nome.toUpperCase(),NW-18),tx,y+56);
    }
  });
  ctx.restore();
  renderLegend(nodes);
}

function rr(ctx,x,y,w,h,r){
  if(typeof r==='number') r=[r,r,r,r];
  const[tl,tr,br,bl]=r;
  ctx.beginPath();
  ctx.moveTo(x+tl,y);ctx.lineTo(x+w-tr,y);ctx.quadraticCurveTo(x+w,y,x+w,y+tr);
  ctx.lineTo(x+w,y+h-br);ctx.quadraticCurveTo(x+w,y+h,x+w-br,y+h);
  ctx.lineTo(x+bl,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-bl);
  ctx.lineTo(x,y+tl);ctx.quadraticCurveTo(x,y,x+tl,y);
  ctx.closePath();
}
function trunc(ctx,text,maxW){
  if(ctx.measureText(text).width<=maxW) return text;
  let t=text;while(t.length>0&&ctx.measureText(t+'…').width>maxW) t=t.slice(0,-1);return t+'…';
}

/* ══════════════════════════════════════════════════════════════════════════════
   LEGEND
   ══════════════════════════════════════════════════════════════════════════ */
function renderLegend(){
  // groups
  const usedG=grupos.filter(g=>people.some(p=>p.grupoId===g.id));
  const lgEl=document.getElementById('legGroups');
  const lgGEl=document.getElementById('legGroupsGrid');
  if(usedG.length){
    lgEl.style.display='';
    lgGEl.innerHTML=usedG.map(g=>{
      const pal=PAL[g.palIdx%PAL.length];
      const cnt=people.filter(p=>p.grupoId===g.id).length;
      return `<div class="leg-i"><div class="leg-bar" style="background:${pal.border};"></div>
        <div class="leg-inf"><div class="leg-cargo">${esc(g.nome)}</div>
        <div class="leg-names">${cnt} pessoa${cnt!==1?'s':''}</div></div></div>`;
    }).join('');
  } else lgEl.style.display='none';

  // cargos
  const cargoMap={};
  people.forEach(p=>{ (cargoMap[p.cargo]=cargoMap[p.cargo]||{nomes:[],grupoId:p.grupoId}).nomes.push(p.nome); });
  const lfEl=document.getElementById('legFuncs');
  const lfGEl=document.getElementById('legFuncsGrid');
  const cargos=Object.keys(cargoMap);
  if(cargos.length){
    lfEl.style.display='';
    lfGEl.innerHTML=cargos.map(c=>{
      const info=cargoMap[c];
      const g=grupos.find(x=>x.id===info.grupoId);
      const bar=g?PAL[g.palIdx%PAL.length].border:'#d1d5db';
      const nomes=info.nomes.join(', ');
      return `<div class="leg-i"><div class="leg-bar" style="background:${bar};height:18px;"></div>
        <div class="leg-inf"><div class="leg-cargo">${esc(c)}</div>
        <div class="leg-names">${esc(nomes.length>55?nomes.slice(0,53)+'…':nomes)}</div></div></div>`;
    }).join('');
  } else lfEl.style.display='none';
}

    const p=localStorage.getItem('org4_people');
    if(f) funcoes=JSON.parse(f);
    if(g){ grupos=JSON.parse(g); _gid=Number(localStorage.getItem('org4_gid')||1); }
    if(p){ people=JSON.parse(p); _pid=Number(localStorage.getItem('org4_pid')||1); }
  }catch(e){}
}

function showErr(el,msg){ el.textContent=msg;el.classList.add('on'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.getElementById('editModal').addEventListener('click',e=>{ if(e.target===document.getElementById('editModal')) closeModal(); });
document.getElementById('fCargo').addEventListener('change',function(){
  document.getElementById('fgCargoCustom').style.display=this.value==='__OUTRO__'?'':'none';
});

if(!funcoes.length) funcoes=[...DEFAULT_FUNCOES];
if(!grupos.length){
  DEFAULT_GRUPOS.forEach(g=>grupos.push({id:_gid++,nome:g.nome,palIdx:g.palIdx}));

renderAll();
